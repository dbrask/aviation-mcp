# DEMO ONLY: Keycloak for `make demo-obo`. Loopback only, plain HTTP, throwaway admin
# password, and a realm whose users and client secrets are throwaway demo values.
# No volumes: the realm is imported fresh into a new container on every run.
name: aviation-mcp-demo
services:
  keycloak:
    # 26.8.2 pinned by digest: the tag has been rebuilt (26.8.2-1 to -3).
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: DEMO-ONLY-admin
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/aviation-demo-realm.json:/opt/keycloak/data/import/aviation-demo-realm.json:ro

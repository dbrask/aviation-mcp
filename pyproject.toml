[project]
name = "aviation-mcp"
version = "0.1.0"
description = "Read-only MCP server: airport weather (aviationweather.gov) and flight data (OpenSky Network)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp==2.3.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
aviation-mcp = "aviation_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "respx>=0.21",
    "pyyaml>=6",
    "ruff>=0.6",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aviation_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Network is blocked for the whole suite (pytest-socket). Unix sockets stay allowed
# because asyncio's event loop uses a socketpair internally.
addopts = "--disable-socket --allow-unix-socket -q"

[tool.ruff]
line-length = 100
target-version = "py312"
